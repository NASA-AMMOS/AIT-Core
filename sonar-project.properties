# SonarQube Cloud configuration for AIT-Core
#
# Set up per the AMMOS scanning guide:
#   https://wiki.jpl.nasa.gov/display/AmmosArch/Code+Vulnerability+Scanning+Set+Up+for+AMMOS+Open+Source+Software
sonar.projectKey=NASA-AMMOS_AIT-Core
sonar.organization=nasa-ammos

# Project metadata. projectVersion is overridden from pyproject.toml by the
# Security-Scan workflow, so the value here is only a fallback for a scan run
# outside that workflow.
sonar.projectName=AIT-Core
sonar.projectVersion=3.1.1
sonar.projectDescription=AMMOS Instrument Toolkit (AIT) Core - NASA JPL's ground data system toolkit for instrument and CubeSat missions.

# Project links - shown in the SonarQube Cloud UI
sonar.links.homepage=https://ait-core.readthedocs.io/en/latest
sonar.links.scm=https://github.com/NASA-AMMOS/AIT-Core
sonar.links.issue=https://github.com/NASA-AMMOS/AIT-Core/issues
sonar.links.ci=https://github.com/NASA-AMMOS/AIT-Core/actions

# ==========================================
# Analysis scope
# ==========================================
# Our own code only:
#   ait/        the Python package -- library modules, the CLI entry points in
#               ait/core/bin, and the ZeroMQ server, plugins and handlers in
#               ait/core/server. This is the whole attack surface worth
#               scanning: dictionary parsing, PCAP handling, the command/
#               telemetry paths and the message bus.
#   openmct/    the OpenMCT integration JavaScript we ship, plus the Node
#               example server that goes with it.
#   scripts/    the example user script shipped in the repo.
#   .github/    workflow definitions, so the CodeQL `actions` findings have
#               source files to attach to, and the SARIF import can map them.
#
# Deliberately not listed:
#   config/, ait/data/, ait/core/data/, sequences/  -- dictionary and settings
#       data, not code (see sonar.exclusions note below).
#   doc/        -- ~90 Sphinx .rst pages and a conf.py that is not shipped.
#   tests/      -- excluded rather than declared via sonar.tests; no coverage
#       report is published today, so indexing them would only add LOC.
#   poetry_cli/ -- two files of doc-build tooling invoked by poetry.
#
# Keep this in step with .github/codeql/codeql-config.yml: SonarQube can only
# attach an imported CodeQL finding to a file that is inside its own analysis
# scope, so anything CodeQL scans must be a source here too.
sonar.sources=ait,openmct,scripts,.github

# Exclusions. These are the only lever that keeps a path out of analysis --
# sonar.test.exclusions is deliberately not used, because it filters the file
# set named by sonar.tests, and sonar.tests is unset here (see the scope note
# above). Test paths therefore belong in this list.
#
# openmct/example-server/ait_integration.js is a git-tracked SYMLINK to
# openmct/ait_integration.js, so indexing it puts the same file in the analysis
# under two paths. That is not merely redundant: SonarQube's SARIF importer
# resolves a finding's file by name, and two candidates make it throw
#   IllegalArgumentException: expected one element but was:
#     <openmct/example-server/ait_integration.js, openmct/ait_integration.js>
# and drop the finding entirely. Measured on run 34529017567, where it silently
# lost the js/unvalidated-dynamic-method-call finding (security-severity 7.5)
# that GitHub code scanning reported at openmct/ait_integration.js:376.
# Excluding the symlink leaves the real file scanned and the import intact.
#
# Note this exclusion belongs HERE and NOT in the CodeQL config. CodeQL
# resolves the symlink, so listing the link path in codeql-config.yml
# paths-ignore excludes the target as well: run 34555766403 did exactly that
# and returned zero JavaScript results, suppressing the very finding this is
# meant to preserve. CodeQL handles the duplicate correctly on its own,
# reporting once against the real path; only SonarQube's importer needs help.
sonar.exclusions=\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/.tox/**,\
  **/.venv/**,\
  **/dist/**,\
  **/build/**,\
  **/*.egg-info/**,\
  ait/data/**,\
  ait/core/data/**,\
  **/package-lock.json,\
  openmct/example-server/ait_integration.js,\
  **/*.min.js,\
  **/*.png,\
  tests/**,\
  **/test_*.py,\
  **/*.test.js

# Coverage exclusions - no coverage report is published today, but these
# should never count against it when one is.
sonar.coverage.exclusions=\
  tests/**,\
  **/test_*.py,\
  ait/core/bin/**,\
  openmct/example-server/**,\
  scripts/**,\
  .github/**

# Duplication exclusions. The CLI entry points in ait/core/bin share a common
# argparse/main skeleton by design; flagging that as duplication is noise.
sonar.cpd.exclusions=\
  ait/core/bin/**,\
  **/*.min.js

# Language settings. AIT-Core supports Python >= 3.10 < 3.12 (pyproject.toml).
sonar.python.version=3.10,3.11
sonar.javascript.file.suffixes=.js,.mjs
sonar.sourceEncoding=UTF-8

sonar.tags=nasa,ammos,ait,ground-data-system,telemetry,python,cubesat

# New Code: anything added in the last 30 days counts as new.
sonar.leak.period=30

# sonar.sarifReportPaths is supplied by the Security-Scan workflow, which
# passes the repaired CodeQL reports on the scanner command line.
